allowBuilds:
  core-js: false
  esbuild: true
  tesseract.js: true
  unrs-resolver: true
  workerd: false

supportedArchitectures:
  os:
    - win32
    - linux
  cpu:
    - x64
overrides:
  nanoid: 3.3.18
  postcss: 8.5.28
  sharp: 0.35.5
  # Security fixes for packages that come in through other packages (2026-11-04).
  'vite@<8.2.4': ^8.3.5
  'source-map-js@<1.2.2': ^1.2.2
  'postcss-selector-parser@<6.1.5': ^6.1.5
  'follow-redirects@<1.16.2': ^1.16.2
  'minimatch@>=10 <11.0.1': ^11.0.4
  'glob@>=9 <14.0.2': ^14.0.3
